version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: analytics
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://analytics:analytics@db:5432/analytics
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: super-secret
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
    command: bash -lc "alembic upgrade head && python scripts/generate_demo_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  worker:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://analytics:analytics@db:5432/analytics
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: celery -A app.tasks.celery_app.celery_app worker -Q analytics --loglevel=info

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8000/api/v1
    ports:
      - "5173:5173"

volumes:
  pg_data:
